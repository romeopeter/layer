[package]
name = "layer"
version = "0.1.0"
description = "Layer — desktop-first branded graphics editor"
edition = "2024"
rust-version = "1.90"

[lib]
name = "layer_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tauri-plugin-clipboard-manager = "2"
png = "0.18"
tauri-plugin-updater = "2"
zune-heic = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Debug info for ~350 dependencies is most of `target/`. Our own code keeps it.
[profile.dev.package."*"]
debug = false

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
